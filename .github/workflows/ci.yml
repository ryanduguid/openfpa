name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        dependency-set: [current]
        include:
          - python-version: "3.11"
            dependency-set: minimum

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        env:
          DEPENDENCY_SET: ${{ matrix.dependency-set }}
        run: |
          python -m pip install --upgrade pip
          if [ "$DEPENDENCY_SET" = "minimum" ]; then
            pip install -e ".[dev]" "pydantic==2.5.0" "pandas==2.0.0" "numpy<2"
          else
            pip install -e ".[dev]"
          fi
          python -m pip check
          python -m pip list

      - name: Run tests
        run: pytest -q
